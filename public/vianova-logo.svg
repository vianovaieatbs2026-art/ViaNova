<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="vnRingGrad" x1="50" y1="20" x2="350" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0047b3" />
      <stop offset="35%" stop-color="#0066ff" />
      <stop offset="70%" stop-color="#00aaff" />
      <stop offset="100%" stop-color="#003399" />
    </linearGradient>

    <radialGradient id="vnBgGlow" cx="50%" cy="45%" r="55%" fx="50%" fy="35%">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="75%" stop-color="#eef5ff" />
      <stop offset="100%" stop-color="#e3eeff" />
    </radialGradient>

    <linearGradient id="vnCircuitGrad" x1="90" y1="180" x2="210" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="60%" stop-color="#0077b6" />
      <stop offset="100%" stop-color="#023e8a" />
    </linearGradient>

    <linearGradient id="vnRoadGrad" x1="180" y1="230" x2="310" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#03045e" />
      <stop offset="30%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="vnRoadEdge" x1="180" y1="230" x2="310" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0077b6" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <linearGradient id="vnViaTextGrad" x1="60" y1="270" x2="190" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0072ff" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <linearGradient id="vnSwooshGrad" x1="180" y1="100" x2="280" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0096c7" />
      <stop offset="100%" stop-color="#48cae4" />
    </linearGradient>
  </defs>

  <circle cx="200" cy="200" r="186" fill="url(#vnBgGlow)" stroke="url(#vnRingGrad)" stroke-width="16" />

  <path d="M 185 130 C 215 90, 255 85, 290 92" stroke="url(#vnSwooshGrad)" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Circuit nodes -->
  <circle cx="112" cy="144" r="5" fill="#0077b6" />
  <path d="M 117 144 L 142 144 L 160 162" stroke="#0077b6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="104" cy="166" r="5" fill="#0096c7" />
  <path d="M 109 166 L 138 166 L 152 180" stroke="#0096c7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="98" cy="182" r="5" fill="#0077b6" />
  <path d="M 103 182 L 132 182 L 148 198" stroke="#0077b6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="120" cy="202" r="5" fill="#0096c7" />
  <path d="M 125 202 L 155 202 L 168 212" stroke="#0096c7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- V left arm -->
  <path d="M 118 112 L 174 112 L 204 205 L 182 205 Z" fill="url(#vnCircuitGrad)" />
  <path d="M 148 112 L 188 112 L 214 188 L 196 188 Z" fill="#0056b3" opacity="0.35" />

  <!-- V right road arm -->
  <path d="M 194 218 C 180 210, 172 195, 176 178 C 180 155, 204 135, 235 118 C 255 107, 280 102, 310 102 L 305 110 C 275 110, 250 116, 232 126 C 205 142, 192 160, 190 178 C 188 196, 196 208, 208 214 Z" fill="url(#vnRoadEdge)" />
  <path d="M 192 216 C 182 206, 182 190, 190 174 C 200 152, 222 134, 252 118 C 274 107, 296 103, 312 103 L 308 114 C 290 115, 270 120, 250 128 C 226 142, 210 158, 202 174 C 196 188, 200 200, 208 208 Z" fill="url(#vnRoadGrad)" />

  <!-- Road markings -->
  <line x1="205" y1="198" x2="209" y2="190" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="214" y1="180" x2="220" y2="168" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  <line x1="228" y1="156" x2="238" y2="144" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <line x1="250" y1="134" x2="264" y2="124" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" />
  <line x1="278" y1="116" x2="296" y2="110" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" />

  <!-- Pin -->
  <path d="M 302 78 C 292 78, 284 86, 284 96 C 284 108, 302 122, 302 122 C 302 122, 320 108, 320 96 C 320 86, 312 78, 302 78 Z" fill="#0056b3" />
  <circle cx="302" cy="94" r="5.5" fill="#ffffff" />

  <!-- Typography -->
  <text x="55" y="278" fill="url(#vnViaTextGrad)" font-size="68" font-weight="900" font-family="Inter, system-ui, sans-serif" letter-spacing="-0.03em">Via</text>
  <text x="170" y="278" fill="#0a192f" font-size="68" font-weight="900" font-family="Inter, system-ui, sans-serif" letter-spacing="-0.03em">Nova</text>

  <line x1="62" y1="298" x2="88" y2="298" stroke="#0052cc" stroke-width="1.8" stroke-linecap="round" />
  <text x="200" y="301" text-anchor="middle" fill="#0a192f" font-size="11" font-weight="800" font-family="Inter, system-ui, sans-serif" letter-spacing="0.14em">MOVILIDAD INTELIGENTE PARA TU CIUDAD</text>
  <line x1="312" y1="298" x2="338" y2="298" stroke="#0052cc" stroke-width="1.8" stroke-linecap="round" />
</svg>
